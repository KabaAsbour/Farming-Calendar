  <head>
    <meta charset="UTF-8" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <meta name="description" content="Bilingual agricultural planning and agribusiness management platform for crops, farm operations, harvest forecasting, buyer orders, and logistics." />
    <meta property="og:title" content="FARMING CALENDAR — Agribusiness &amp; Crop Management SaaS" />
    <meta property="og:description" content="Bilingual agricultural planning and agribusiness management platform for crops, farm operations, harvest forecasting, buyer orders, and logistics." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      if (typeof window !== 'undefined') {
        window.global = window;
        if (!window.Buffer) {
          window.Buffer = {
            isBuffer: function() { return false; },
            from: function(data) {
              if (typeof data === 'string') return new TextEncoder().encode(data);
              return new Uint8Array(data || 0);
            },
            alloc: function(size) { return new Uint8Array(size); }
          };
        }
        // Gracefully ignore benign Vite HMR WebSocket disconnects in AI Studio preview iframe
        window.addEventListener('unhandledrejection', function(event) {
          var reason = event.reason;
          var msg = (reason && (reason.message || String(reason))) || '';
          if (msg.includes('WebSocket') || msg.includes('ws') || (reason && reason.stack && reason.stack.includes('@vite/client'))) {
            event.preventDefault();
          }
        });
        window.addEventListener('error', function(event) {
          var msg = event.message || '';
          if (msg.includes('WebSocket') || (event.filename && event.filename.includes('@vite/client'))) {
            event.preventDefault();
          }
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
